name: Standard Test
on: [push]

concurrency:
  group: ${{ github.ref }}-rainix
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-test:
    permissions:
      id-token: write
      contents: write
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 10G

      - name: Prepare Sushi Lib
        run: ./prep-sushi.sh

      - name: Install Dependencies
        run:  nix develop -c npm install

      - name: Lint
        run:  nix develop -c npm run lint
      
      - name: Run Tests
        run: nix develop -c npm run unit-test
  
  e2e-test:
    name: e2e fork test
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chain: [POLYGON, ARBITRUM, ETH, FLARE, BSC, BASE, LINEA]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 10G

      - name: Prepare Sushi Lib
        run: ./prep-sushi.sh

      - name: Install Dependencies
        run:  nix develop -c npm install

      - name: Restore Hardhat Fork Cache
        uses: actions/cache@v6
        with:
          path: cache
          key: hardhat-fork-cache-${{ matrix.chain }}-${{ hashFiles('hardhat.config.ts') }}
          restore-keys: |
            hardhat-fork-cache-${{ matrix.chain }}-

      - name: Set Chain Rpc Key
        run: echo "RPC=RPC_URL_${{ matrix.chain == 'ETH' && 'ETHEREUM' || matrix.chain }}_FORK" >> "$GITHUB_ENV"

      # Base and Ethereum fork through a local eRPC (rainix's rpc-proxy): our
      # own node first, signed in with this job's GitHub OIDC token, then
      # public RPCs, then the RPC_URL_<CHAIN>_FORK secret, failing over per
      # request. It exports RPC_URL_BASE_FORK / RPC_URL_ETHEREUM_FORK pointing
      # at itself, so env[env.RPC] picks the proxy for those two chains and
      # the secret for the rest, which have no node of ours. The proxy serves
      # both chains in either job, so both get their secret as last resort.
      # If the proxy step fails at any stage (even after it exported its local
      # URLs), the tests read the secret as before.
      - name: RPC proxy
        id: proxy
        if: matrix.chain == 'BASE' || matrix.chain == 'ETH'
        continue-on-error: true
        uses: rainlanguage/rainix/.github/actions/rpc-proxy@main
        env:
          RAINIX_RPC_SECRET_BASE: ${{ secrets.RPC_URL_BASE_FORK }}
          RAINIX_RPC_VARS_BASE: ${{ vars.RPC_URL_BASE_FORK }}
          RAINIX_RPC_SECRET_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_VARS_ETHEREUM: ${{ vars.RPC_URL_ETHEREUM_FORK }}

      - name: Run Tests
        run: TEST_${{ matrix.chain }}_RPC="$DEFAULT_RPC" nix develop -c npm run e2e-test
        env:
          DEFAULT_RPC: ${{ (steps.proxy.outcome == 'success' && env[env.RPC]) || secrets[env.RPC] }}

      - name: RPC proxy report
        if: always() && (matrix.chain == 'BASE' || matrix.chain == 'ETH')
        uses: rainlanguage/rainix/.github/actions/rpc-proxy@main
        with:
          mode: report